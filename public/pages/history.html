<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سجل العمليات - تحديث جماعي سلة</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <div id="header-slot"></div>

  <main class="main-content">
    <div class="card">
      <div class="card-header" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
        <div>
          <h1 class="card-title">سجل العمليات السابقة</h1>
          <p class="card-subtitle">عرض آخر 20 عملية تحديث أو تراجع.</p>
        </div>
        <a href="/pages/upload.html" class="btn btn-primary">
          + تحديث جديد
        </a>
      </div>

      <div id="content">
        <div class="empty-state">
          <span class="spinner spinner-primary" style="width:32px;height:32px;"></span>
          <p style="margin-top:12px; color:var(--salla-gray);">جاري تحميل السجل...</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script>
  document.getElementById('header-slot').innerHTML = App.header();
  loadHistory();

  async function loadHistory() {
    try {
      const data = await App.api('GET', '/api/jobs');
      renderHistory(data.jobs || []);
    } catch (err) {
      document.getElementById('content').innerHTML =
        `<div class="alert alert-danger"><span class="alert-icon">⚠️</span><div>${err.message}</div></div>`;
    }
  }

  function renderHistory(jobs) {
    if (jobs.length === 0) {
      document.getElementById('content').innerHTML = `
        <div class="empty-state">
          <span class="empty-state-icon">📋</span>
          <p class="empty-state-title">لا توجد عمليات سابقة</p>
          <p style="color:var(--salla-gray); font-size:13px;">ابدأ بتحديث منتجاتك باستخدام زر "تحديث جديد".</p>
        </div>`;
      return;
    }

    const statusMap = {
      completed: ['badge-success', 'مكتمل'],
      running:   ['badge-primary', 'جاري التنفيذ'],
      failed:    ['badge-danger', 'فشل'],
      pending:   ['badge-warning', 'معلق']
    };

    document.getElementById('content').innerHTML = `
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>التاريخ</th>
              <th>اسم الملف</th>
              <th>المنتجات المحدثة</th>
              <th>الفشل</th>
              <th>الإجمالي</th>
              <th>الحالة</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody>
            ${jobs.map(job => {
              const [cls, label] = statusMap[job.status] || ['badge-gray', job.status];
              const date = new Date(job.created_at).toLocaleDateString('ar-SA', {
                year: 'numeric', month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
              });
              const isUndo = job.filename?.startsWith('undo-');

              return `
                <tr>
                  <td style="font-size:12px; color:var(--salla-gray); white-space:nowrap;">${date}</td>
                  <td>
                    ${isUndo
                      ? '<span class="badge badge-warning" style="font-size:10px;">تراجع</span>'
                      : `<span style="font-size:13px; max-width:200px; overflow:hidden; text-overflow:ellipsis; display:inline-block;">${esc(job.filename || '-')}</span>`
                    }
                  </td>
                  <td><strong style="color:var(--salla-success);">${(job.updated || 0).toLocaleString('ar-SA')}</strong></td>
                  <td><strong style="color:${job.failed > 0 ? 'var(--salla-danger)' : 'var(--salla-gray)'};">${(job.failed || 0).toLocaleString('ar-SA')}</strong></td>
                  <td>${(job.total_rows || 0).toLocaleString('ar-SA')}</td>
                  <td><span class="badge ${cls}">${label}</span></td>
                  <td>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                      <button class="btn btn-ghost btn-sm" onclick="viewReport('${job.id}')">
                        📊 التقرير
                      </button>
                      ${!isUndo && job.status === 'completed' && job.updated > 0
                        ? `<button class="btn btn-sm" style="background:#FEE2E2; color:#991B1B; border:none; cursor:pointer;" onclick="undoJob('${job.id}')">↩️ تراجع</button>`
                        : ''}
                    </div>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }

  function viewReport(jobId) {
    window.location.href = `/api/jobs/${jobId}/results/download`;
  }

  function undoJob(jobId) {
    App.save('undoJobId', jobId);
    window.location.href = '/pages/undo.html';
  }

  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
</script>
</body>
</html>
