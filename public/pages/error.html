<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خطأ - تحديث جماعي سلة</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <div id="header-slot"></div>
  <main class="main-content">
    <div class="card">
      <div class="empty-state">
        <span class="empty-state-icon">⚠️</span>
        <p class="empty-state-title" id="errorMsg">حدث خطأ غير متوقع</p>
        <p style="color:var(--salla-gray); font-size:13px; margin-bottom:24px;">يرجى المحاولة مرة أخرى أو التواصل مع الدعم الفني.</p>
        <a href="/auth/login" class="btn btn-primary">تسجيل الدخول مجدداً</a>
      </div>
    </div>
  </main>
</div>
<script src="/js/app.js"></script>
<script>
  document.getElementById('header-slot').innerHTML = App.header();
  const params = new URLSearchParams(window.location.search);
  const msg = params.get('msg');
  if (msg) document.getElementById('errorMsg').textContent = decodeURIComponent(msg);
</script>
</body>
</html>
