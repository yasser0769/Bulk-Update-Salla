<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التحديث - تحديث جماعي سلة</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .execute-center {
      max-width: 560px;
      margin: 0 auto;
    }

    .big-progress {
      margin: 36px 0;
    }

    .big-progress .progress-bar-track {
      height: 20px;
      border-radius: 20px;
    }

    .execute-counts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 24px;
      text-align: center;
    }

    .count-box {
      padding: 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--salla-border);
      background: var(--salla-white);
    }

    .count-box .number {
      font-size: 36px;
      font-weight: 700;
      display: block;
    }

    .count-box .label {
      font-size: 12px;
      color: var(--salla-gray);
      margin-top: 4px;
      display: block;
    }

    .status-message {
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: var(--salla-secondary);
      margin: 20px 0;
    }

    .pulse-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--salla-success);
      border-radius: 50%;
      margin-left: 8px;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .completed-icon {
      font-size: 64px;
      text-align: center;
      display: block;
      margin: 20px 0;
    }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="header-slot"></div>

  <main class="main-content">
    <div id="stepper-slot"></div>

    <div class="card">
      <div class="execute-center">
        <div class="card-header" style="text-align:center;">
          <h1 class="card-title" id="pageTitle">جاري تحديث المنتجات</h1>
          <p class="card-subtitle" id="pageSubtitle">يرجى الانتظار حتى اكتمال عملية التحديث. لا تغلق هذه الصفحة.</p>
        </div>

        <!-- Running state -->
        <div id="runningState">
          <div class="status-message" id="statusMessage">
            <span class="pulse-dot"></span>
            جاري التحديث...
          </div>

          <div class="big-progress progress-container">
            <div class="progress-label">
              <span id="progressText">0 من 0</span>
              <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-track">
              <div class="progress-bar-fill" id="progressFill"></div>
            </div>
          </div>

          <div class="execute-counts">
            <div class="count-box">
              <span class="number" id="countUpdated" style="color: var(--salla-success);">0</span>
              <span class="label">تم تحديثه</span>
            </div>
            <div class="count-box">
              <span class="number" id="countRemaining" style="color: var(--salla-primary);">0</span>
              <span class="label">متبقي</span>
            </div>
            <div class="count-box">
              <span class="number" id="countFailed" style="color: var(--salla-danger);">0</span>
              <span class="label">فشل</span>
            </div>
          </div>

          <div class="alert alert-warning" style="margin-top: 24px;">
            <span class="alert-icon">⚠️</span>
            <div>لا تغلق هذه الصفحة أو المتصفح أثناء التحديث.</div>
          </div>
        </div>

        <!-- Completed state (hidden initially) -->
        <div id="completedState" style="display:none; text-align:center;">
          <span class="completed-icon" id="completedIcon">✅</span>
          <p id="completedMessage" style="font-size:16px; color:var(--salla-gray); margin-bottom:24px;"></p>
          <button class="btn btn-primary btn-lg" onclick="goToResults()">
            عرض النتائج التفصيلية
            <span style="font-size:16px;">←</span>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script>
  document.getElementById('header-slot').innerHTML = App.header();
  document.getElementById('stepper-slot').innerHTML = App.stepper(4);

  const jobId = App.load('currentJobId');

  if (!jobId) {
    window.location.href = '/pages/upload.html';
  }

  let eventSource = null;

  function startListening() {
    eventSource = new EventSource(`/api/jobs/${jobId}/progress`);

    eventSource.onmessage = (e) => {
      const data = JSON.parse(e.data);
      updateProgress(data);

      if (data.status === 'completed' || data.status === 'failed') {
        eventSource.close();
        showCompleted(data);
      }
    };

    eventSource.onerror = () => {
      eventSource.close();
      // Fallback to polling
      setTimeout(pollStatus, 2000);
    };
  }

  async function pollStatus() {
    try {
      const data = await App.api('GET', `/api/jobs/${jobId}/status`);
      updateProgress({
        total: data.total_rows,
        updated: data.updated,
        failed: data.failed,
        remaining: data.total_rows - data.updated - data.failed,
        status: data.status
      });

      if (data.status === 'completed' || data.status === 'failed') {
        showCompleted(data);
      } else {
        setTimeout(pollStatus, 2000);
      }
    } catch {
      setTimeout(pollStatus, 3000);
    }
  }

  function updateProgress(data) {
    const total = data.total || 1;
    const updated = data.updated || 0;
    const failed = data.failed || 0;
    const remaining = data.remaining || Math.max(0, total - updated - failed);
    const percent = Math.round((updated + failed) / total * 100);

    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressText').textContent = `${(updated + failed).toLocaleString('ar-SA')} من ${total.toLocaleString('ar-SA')}`;
    document.getElementById('progressPercent').textContent = percent + '%';
    document.getElementById('countUpdated').textContent = updated.toLocaleString('ar-SA');
    document.getElementById('countRemaining').textContent = remaining.toLocaleString('ar-SA');
    document.getElementById('countFailed').textContent = failed.toLocaleString('ar-SA');
  }

  function showCompleted(data) {
    document.getElementById('runningState').style.display = 'none';
    document.getElementById('completedState').style.display = 'block';

    const total = data.total || data.total_rows || 0;
    const updated = data.updated || 0;
    const failed = data.failed || 0;

    if (data.status === 'failed' && updated === 0) {
      document.getElementById('pageTitle').textContent = 'فشل التحديث';
      document.getElementById('completedIcon').textContent = '❌';
      document.getElementById('completedMessage').textContent =
        `فشل تحديث جميع المنتجات (${failed.toLocaleString('ar-SA')} خطأ). يرجى مراجعة التقرير.`;
    } else {
      document.getElementById('pageTitle').textContent = 'اكتمل التحديث';
      document.getElementById('pageSubtitle').textContent = '';
      document.getElementById('completedMessage').textContent =
        `تم تحديث ${updated.toLocaleString('ar-SA')} منتج بنجاح${failed > 0 ? `، وفشل ${failed.toLocaleString('ar-SA')}` : ''}.`;
    }
  }

  function goToResults() {
    window.location.href = `/pages/results.html`;
  }

  // Start
  startListening();
</script>
</body>
</html>
